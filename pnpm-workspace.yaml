  "rollup>@rollup/rollup-openharmony-arm64": "-"
  "rollup>@rollup/rollup-win32-arm64-msvc": "-"
  "rollup>@rollup/rollup-win32-ia32-msvc": "-"
  "rollup>@rollup/rollup-win32-x64-gnu": "-"
  "rollup>@rollup/rollup-win32-x64-msvc": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-darwin-arm64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-darwin-x64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-freebsd-ia32": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-freebsd-x64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-linux-arm64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-linux-arm": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-linux-ia32": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-sunos-x64": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-win32-ia32": "-"
  "@expo/ngrok-bin>@expo/ngrok-bin-win32-x64": "-"
  # drizzle-kit uses esbuild internally on an older version that's vulnerable, this overrides it
  "@esbuild-kit/esm-loader": "npm:tsx@^4.21.0"
  esbuild: "0.27.3"
  # Security overrides — pinned to safe patch ranges to avoid surprise major bumps
  picomatch: "~4.0.4"          # GHSA-c2c7-rcm5-vvqj, GHSA-3v7f-55p6-f55p (ReDoS + method injection)
  path-to-regexp: "~8.4.2"    # GHSA-j3q9-mxjg-w52f, GHSA-27v5-c462-wpq7 (DoS via optional groups)
  lodash: "~4.18.1"           # GHSA-r5fr-rjxr-66jc, GHSA-f23m-r3pf-42rh (code injection via _.template)
  postcss: "~8.5.13"          # GHSA-qx2v-qp2m-jg93 (parse vulnerability)

  yaml: "~2.8.4"              # GHSA-48c2-rrv3-qjmp
  uuid: "~14.0.0"              # GHSA-w5hq-g745-h8pq (missing buffer bounds check, patched >=14.0.0)

  # Transitive dependency security patches — none require a major version bump
  "@xmldom/xmldom": "~0.8.13"  # GHSA-crh6-fp67-6883 (DoS), GHSA-5fg8-2547-mr8q (tampering)
  node-forge: "~1.4.0"         # GHSA-x4jg-mjrx-434g (crypto bypass), GHSA-2r2c-g63r-vccr (DoS), GHSA-cfm4-qjh2-4765 (injection)
  minimatch: "~5.1.8"          # GHSA-f8q6-p94x-37v3 (ReDoS)
  tar: "~7.5.16"               # GHSA-3xgq-45jj-v275, GHSA-mg98-7p99-jxhp (path traversal), GHSA-vmf3-w455-68vh (PAX smuggling, fix >=7.5.16)
  ajv: "~8.18.0"               # GHSA-v6b9-6x5j-xhj3 (input DoS)
  ip-address: "~10.1.1"        # GHSA-m6vp-8q9j-whx4 (validation bypass)
  fast-uri: "~3.1.2"           # GHSA-p5x6-c79v-8259 (URI injection)
  diff: "~8.0.4"               # GHSA-73rr-hh4g-fpgx (ReDoS in 7.0.0, fixed in 8.x)
  # GHSA-jxxr-4gwj-5jf2: brace-expansion@5.0.5 ReDoS — override forces >=5.0.6.
  # Audited 2026-05-19: no brace-expansion@5.x snapshot present in lockfile (v5 not
  # a live transitive dep); override is a forward safety pin. v1/v2 unaffected.
  "brace-expansion@5": "~5.0.6"
  # GHSA-96hv-2xvq-fx4p: ws memory exhaustion DoS — affects ws@8<8.21.0, ws@7<7.5.11, ws@6<6.2.4.
  # Global override forces all ws resolutions to >=8.21.0 which includes the DoS fix.
  # Previously ~8.20.1 (GHSA-58qx-3vcg-4xpx information disclosure fix); bumped Jun 2026.
  ws: ">=8.21.0"
  # GHSA-7c78-jf6q-g5cm: tmp path traversal via type confusion — fix >=0.2.7 (in package.json overrides).
  # GHSA-hmw2-7cc7-3qxx: form-data CRLF injection in multipart field names/filenames.
  form-data: ">=4.0.6"
  # GHSA-6v5v-wf23-fmfq: markdown-it quadratic complexity DoS in smartquotes rule.
  markdown-it: ">=14.2.0"
  # GHSA-h67p-54hq-rp68: js-yaml quadratic DoS via merge key repeated aliases — fix >=4.2.0.
  # Covers both js-yaml@3 and js-yaml@4 transitive deps by forcing all to 4.2.0+.
  js-yaml: ">=4.2.0"
  # GHSA-4x5r-pxfx-6jf8: @babel/core arbitrary file read via sourceMappingURL comment.
  "@babel/core": ">=7.29.6"
  # Pin @babel/generator alongside @babel/core so only ONE version exists. The core
  # override left a 2nd generator version, which blocked pnpm from hoisting it; that
  # broke react-native-worklets/plugin's bare require('@babel/generator') → Metro
  # "Cannot find module '@babel/generator'" → HTTP 500 → cashclip bundle/deploy fail.
  "@babel/generator": ">=7.29.6"
  # (tmp security override is in package.json pnpm.overrides — see GHSA-7c78-jf6q-g5cm)