name: Build Production

on:
  workflow_call: {}

jobs:
  build:
    name: Build production
    steps:
      - run:
          name: Check app version and SIGNING.md sync
          command: |
            cd ../../
            pnpm --filter @workspace/scripts run check-signing-md-sync
      - run:
          name: Check build number
          command: |
            cd ../../
            git fetch --depth=2 origin HEAD 2>/dev/null || true
            pnpm --filter @workspace/scripts run check-build-number -- --committed
      - run:
          name: Check Expo package versions
          command: |
            cd ../../
            pnpm --filter @workspace/cashclip run check:versions
      - eas/build:
          name: EAS Build (production)
          inputs:
            profile: production
            platform: all
