kind = "mobile"
previewPath = "/"
title = "CashClip"
version = "1.0.0"
id = "artifacts/cashclip"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25937

[services.development]
run = "pnpm --filter @workspace/cashclip run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/cashclip", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/cashclip", "run", "serve" ]

[services.env]
PORT = "25937"
BASE_PATH = "/"
