kind = "web"
previewPath = "/absustain/"
title = "AB Sustainability Investments"
version = "1.0.0"
id = "artifacts/absustain"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/absustain/" ]
localPort = 22757

[services.development]
run = "pnpm --filter @workspace/absustain run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/absustain", "run", "build" ]
publicDir = "artifacts/absustain/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22757"
BASE_PATH = "/absustain/"
