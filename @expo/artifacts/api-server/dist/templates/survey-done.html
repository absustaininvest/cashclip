<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Survey Complete — CashClip</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0b0b0c;
      color: #eaeaea;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .card {
      max-width: 360px;
      width: 100%;
    }
    .icon {
      width: 72px;
      height: 72px;
      background: #1a3a2a;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }
    .icon svg {
      width: 36px;
      height: 36px;
      stroke: #34d399;
    }
    h1 {
      font-size: 22px;
      font-weight: 700;
      margin-bottom: 10px;
      color: #ffffff;
    }
    p {
      font-size: 15px;
      line-height: 1.5;
      color: #9ca3af;
      margin-bottom: 28px;
    }
    .btn {
      display: inline-block;
      background: #22c55e;
      color: #000;
      font-size: 15px;
      font-weight: 600;
      padding: 13px 28px;
      border-radius: 10px;
      text-decoration: none;
      letter-spacing: 0.01em;
    }
    .logo {
      font-size: 13px;
      color: #4b5563;
      margin-top: 32px;
      letter-spacing: 0.05em;
      text-transform: uppercase;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"/>
      </svg>
    </div>
    <h1>You're all done!</h1>
    <p>Your reward is on its way to your CashClip balance. You can close this tab and return to the app.</p>
    <a class="btn" href="cashclip://">Return to CashClip</a>
    <div class="logo">CashClip</div>
  </div>
</body>
</html>
