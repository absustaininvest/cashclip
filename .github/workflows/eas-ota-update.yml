name: EAS OTA Update - Production

on:
  push:
    branches:
      - main
    paths:
      - 'artifacts/cashclip/**'
      - '.github/workflows/eas-ota-update.yml'
  workflow_dispatch:
    inputs:
      message:
        description: 'Update message for users'
        required: false
        default: 'Critical update for CashClip'

jobs:
  publish-ota-update:
    name: Publish OTA Update to Production
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24.0.0'

      - name: Setup pnpm
        uses: pnpm/action-setup@v2
        with:
          version: latest

      - name: Get pnpm store directory
        id: pnpm-cache
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path)" >> $GITHUB_OUTPUT

      - name: Setup pnpm cache
        uses: actions/cache@v3
        with:
          path: ${{ steps.pnpm-cache.outputs.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Publish OTA Update to Production
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          cd artifacts/cashclip
          echo "Publishing OTA update to production branch..."
          npx eas@latest update \
            --branch production \
            --message "${{ github.event.inputs.message || format('OTA Update - {0}', github.sha) }}" \
            --platform all
        continue-on-error: false

      - name: Update Deployment Status
        if: success()
        run: |
          echo "✅ OTA Update Published Successfully"
          echo "Branch: production"
          echo "Timestamp: $(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          echo "Commit: ${{ github.sha }}"

      - name: Notify on Failure
        if: failure()
        run: |
          echo "❌ OTA Update Failed"
          echo "Check EXPO_TOKEN and EAS project configuration"
          exit 1
